<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oregon Random GeoJSON Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-sA+4wMZtR+U9GsK3LMz1e2hUJQWUZH2Hn0z1x5H5l2g="
    crossorigin=""
  />
  <style>
    body, html { margin: 0; height: 100%; }
    #map { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-o9N1j7rBS3V5nU4WZ3ldAy+9N24lVXYkzJNWpryKf3s="
    crossorigin=""
  ></script>
  <script>
    // Adjust this URL if running in Docker Compose — use http://backend:5000/data.geojson inside Docker
    const DATA_URL = "http://localhost:5000/data.geojson";

    const map = L.map('map').setView([43.9, -120.5], 6); // Oregon centered
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let geojsonLayer = null;

    async function updateMap() {
      try {
        const response = await fetch(DATA_URL);
        const data = await response.json();

        // Remove old layer if present
        if (geojsonLayer) {
          map.removeLayer(geojsonLayer);
        }

        geojsonLayer = L.geoJSON(data, {
          pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
            radius: 5,
            fillColor: "red",
            color: "#000",
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8
          })
        }).addTo(map);
      } catch (error) {
        console.error("Error fetching GeoJSON:", error);
      }
    }

    // Initial load
    updateMap();

    // Refresh every 5 seconds
    setInterval(updateMap, 5000);
  </script>
</body>
</html>
