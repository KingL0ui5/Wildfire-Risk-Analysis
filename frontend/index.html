<!DOCTYPE html>
<html>
<head>
    <title>Fetch GeoJSON</title>
</head>
<body>
    <h1>GeoJSON Data</h1>
    <pre id="output"></pre>

    <script>
        // Make GET request to the Flask API
        fetch("http://localhost:5000/data.geojson")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json(); // parse JSON
            })
            .then(data => {
                console.log(data); // log for debugging
                document.getElementById("output").textContent = JSON.stringify(data, null, 2);
            })
            .catch(error => {
                console.error("Error fetching data:", error);
            });
    </script>
</body>
</html>
